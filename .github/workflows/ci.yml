name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: greenink
          POSTGRES_PASSWORD: greenink
          POSTGRES_DB: greenink
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U greenink" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://greenink:greenink@localhost:5433/greenink
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: ruff
        run: uv run ruff format --check . && uv run ruff check .
      - name: mypy
        run: uv run mypy
      - name: import-linter
        run: uv run lint-imports
      - name: contracts are fresh
        run: uv run python scripts/export_contracts.py --check
      - name: pytest
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: generated API types are fresh
        run: pnpm gen:api && git diff --exit-code lib/api/schema.d.ts
      - run: pnpm typecheck
      - run: pnpm build

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
