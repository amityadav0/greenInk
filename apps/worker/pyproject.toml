[project]
name = "greenink-worker"
version = "0.1.0"
description = "Green Ink queue worker: one entrypoint, --queues picks the stages it runs."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arq>=0.28.0",
    "greenink",
]

[project.scripts]
greenink-worker = "greenink_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["greenink_worker"]

[tool.uv.sources]
greenink = { workspace = true }
