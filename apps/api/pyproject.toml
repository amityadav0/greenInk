[project]
name = "greenink-api"
version = "0.1.0"
description = "Green Ink HTTP API (FastAPI, /v1, SSE)."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "greenink",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["greenink_api"]

[tool.uv.sources]
greenink = { workspace = true }
