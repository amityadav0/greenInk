# Frozen contract (SPEC "API contract"). Generated by `make openapi`; do not edit by hand.
# Changing it needs a PR note and a regenerated web client.
openapi: 3.1.0
info:
  title: Green Ink API
  summary: Government tenders a small manufacturer can win, and the clauses that would reject the bid.
  license:
    name: MIT
    identifier: MIT
  version: 0.1.0
paths:
  /healthz:
    get:
      tags:
      - health
      summary: Healthz
      operationId: healthz
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /readyz:
    get:
      tags:
      - health
      summary: Readyz
      operationId: readyz
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyStatus'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/search:
    get:
      tags:
      - search
      summary: Search live bids; cached 30 minutes
      operationId: search
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 200
          description: What the company sells.
          title: Q
        description: What the company sells.
      - name: company_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Company to triage for.
          title: Company Id
        description: Company to triage for.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Rate limited or budget exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/search/{search_id}/events:
    get:
      tags:
      - search
      summary: 'Triage badge updates (event: badge), then event: done'
      operationId: searchEvents
      parameters:
      - name: search_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Search Id
      responses:
        '200':
          description: Successful Response
          content:
            text/event-stream:
              itemSchema:
                type: object
                properties:
                  data:
                    type: string
                    contentMediaType: application/json
                    contentSchema:
                      $ref: '#/components/schemas/SearchBadgeEvent'
                  event:
                    type: string
                  id:
                    type: string
                  retry:
                    type: integer
                    minimum: 0
                required:
                - data
        '422':
          description: Validation error
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenders/upload:
    post:
      tags:
      - tenders
      summary: Upload any tender PDF (non-GeM portals)
      operationId: uploadTender
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF, at most 25 MB.
              type: object
              required:
              - file
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Rate limited or budget exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenders/{tender_id}:
    get:
      tags:
      - tenders
      summary: Get Tender
      operationId: getTender
      parameters:
      - name: tender_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Tender Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenderDetail'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenders/{tender_id}/documents/{document_id}/file:
    get:
      tags:
      - tenders
      summary: The document's bytes, served same-origin for the PDF viewer
      operationId: getTenderDocumentFile
      parameters:
      - name: tender_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Tender Id
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Document Id
      responses:
        '200':
          description: The stored document, for the PDF viewer
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenders/{tender_id}/pages/{page_no}:
    get:
      tags:
      - tenders
      summary: Page text for the viewer's highlight
      operationId: getTenderPage
      parameters:
      - name: tender_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Tender Id
      - name: page_no
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          title: Page No
      - name: document_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Defaults to the tender's main document.
          title: Document Id
        description: Defaults to the tender's main document.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageText'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/companies:
    get:
      tags:
      - companies
      summary: The demo company and this session's companies
      operationId: listCompanies
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Company'
                type: array
                title: Response Listcompanies
    post:
      tags:
      - companies
      summary: Create a company from a manual profile
      operationId: createCompany
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Rate limited or budget exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/companies/from-url:
    post:
      tags:
      - companies
      summary: Draft a company from its website (Tavily); marked unverified
      operationId: createCompanyFromUrl
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyFromUrl'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Rate limited or budget exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/companies/{company_id}/documents:
    post:
      tags:
      - companies
      summary: Upload a document to the company's vault
      operationId: uploadCompanyDocument
      parameters:
      - name: company_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Company Id
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Rate limited or budget exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - kind
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF, PNG or JPEG, at most 25 MB. Type is checked from the bytes.
                kind:
                  type: string
                  enum:
                  - udyam_certificate
                  - gst_certificate
                  - turnover_certificate
                  - balance_sheet
                  - bis_licence
                  - iso_certificate
                  - type_test_report
                  - oem_authorisation
                  - experience_certificate
                  - startup_recognition
                  - other
  /v1/analyses:
    post:
      tags:
      - analyses
      summary: Start an analysis, or return the cached one when its key matches
      operationId: createAnalysis
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisCreate'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Rate limited or budget exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/analyses/{analysis_id}:
    get:
      tags:
      - analyses
      summary: 'Full report: verdict, findings, price intel, stage states'
      operationId: getAnalysis
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Analysis Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisReport'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/analyses/{analysis_id}/events:
    get:
      tags:
      - analyses
      summary: Stage progress; resumes after Last-Event-ID
      operationId: analysisEvents
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Analysis Id
      - name: last-event-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Last-Event-Id
      responses:
        '200':
          description: Successful Response
          content:
            text/event-stream:
              itemSchema:
                type: object
                properties:
                  data:
                    type: string
                    contentMediaType: application/json
                    contentSchema:
                      $ref: '#/components/schemas/JobEvent'
                  event:
                    type: string
                  id:
                    type: string
                  retry:
                    type: integer
                    minimum: 0
                required:
                - data
        '404':
          description: Not found
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation error
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/analyses/{analysis_id}/trace:
    get:
      tags:
      - analyses
      summary: 'Model Trace: model, tokens, $ and ms per call'
      operationId: getAnalysisTrace
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Analysis Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisTrace'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/analyses/{analysis_id}/findings/{finding_id}/fix:
    post:
      tags:
      - analyses
      summary: 'The drafted fix: 200 when ready, else 202 while it is drafted'
      operationId: draftFix
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Analysis Id
      - name: finding_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Finding Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fix'
        '202':
          description: Drafting; poll this endpoint until it returns 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Rate limited or budget exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/analyses/{analysis_id}/export.pdf:
    get:
      tags:
      - analyses
      summary: PDF report (P1)
      operationId: exportAnalysisPdf
      parameters:
      - name: analysis_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Analysis Id
      responses:
        '200':
          description: Successful Response
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Not implemented yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
components:
  schemas:
    Accepted:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        status_url:
          type: string
          title: Status Url
        events_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Events Url
        cached:
          type: boolean
          title: Cached
          description: True when an existing result matched the cache key.
          default: false
      additionalProperties: false
      type: object
      required:
      - id
      - status_url
      title: Accepted
      description: Returned with `202` for long work. Progress is on `events_url` when present.
    Analysis:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        tender_id:
          type: string
          format: uuid
          title: Tender Id
        company_id:
          type: string
          format: uuid
          title: Company Id
        status:
          $ref: '#/components/schemas/AnalysisStatus'
        verdict:
          anyOf:
          - $ref: '#/components/schemas/Verdict'
          - type: 'null'
        verdict_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Verdict Reason
        verdict_rules:
          items:
            $ref: '#/components/schemas/VerdictRule'
          type: array
          title: Verdict Rules
        profile_hash:
          type: string
          title: Profile Hash
        requirements_version:
          type: string
          title: Requirements Version
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      additionalProperties: false
      type: object
      required:
      - id
      - tender_id
      - company_id
      - status
      - profile_hash
      - requirements_version
      - created_at
      - updated_at
      title: Analysis
      description: 'One tender judged for one company. Cached by

        `(tender_id, company_id, profile_hash, requirements_version)`.'
    AnalysisCreate:
      properties:
        tender_id:
          type: string
          format: uuid
          title: Tender Id
        company_id:
          type: string
          format: uuid
          title: Company Id
      additionalProperties: false
      type: object
      required:
      - tender_id
      - company_id
      title: AnalysisCreate
    AnalysisReport:
      properties:
        analysis:
          $ref: '#/components/schemas/Analysis'
        tender:
          $ref: '#/components/schemas/Tender'
        findings:
          items:
            $ref: '#/components/schemas/Finding'
          type: array
          title: Findings
        price_intel:
          items:
            $ref: '#/components/schemas/PriceIntel'
          type: array
          title: Price Intel
        stages:
          items:
            $ref: '#/components/schemas/StageStatus'
          type: array
          title: Stages
      additionalProperties: false
      type: object
      required:
      - analysis
      - tender
      - findings
      - price_intel
      - stages
      title: AnalysisReport
      description: 'The full report: verdict, findings, price intel and stage states.'
    AnalysisStatus:
      type: string
      enum:
      - queued
      - running
      - done
      - partial
      - failed
      title: AnalysisStatus
    AnalysisTrace:
      properties:
        analysis_id:
          type: string
          format: uuid
          title: Analysis Id
        status:
          $ref: '#/components/schemas/AnalysisStatus'
        calls:
          items:
            $ref: '#/components/schemas/LLMCall'
          type: array
          title: Calls
        totals:
          $ref: '#/components/schemas/TraceTotals'
      additionalProperties: false
      type: object
      required:
      - analysis_id
      - status
      - calls
      - totals
      title: AnalysisTrace
    BidSummary:
      properties:
        tender_id:
          type: string
          format: uuid
          title: Tender Id
        source:
          $ref: '#/components/schemas/TenderSource'
        source_ref:
          type: string
          title: Source Ref
        title:
          type: string
          title: Title
        buyer:
          anyOf:
          - type: string
          - type: 'null'
          title: Buyer
        quantity:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Quantity
        closes_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Closes At
        value_inr:
          anyOf:
          - type: number
            minimum: 0.0
            description: Amount in Indian rupees.
          - type: 'null'
          title: Value Inr
        official_url:
          anyOf:
          - type: string
            maxLength: 2083
            minLength: 1
            format: uri
          - type: 'null'
          title: Official Url
        badge:
          anyOf:
          - $ref: '#/components/schemas/TriageBadge'
          - type: 'null'
          description: Null until triage scores it.
      additionalProperties: false
      type: object
      required:
      - tender_id
      - source
      - source_ref
      - title
      title: BidSummary
      description: A search result. Search stores tender metadata, so every result has a `tender_id`.
    BusinessNature:
      type: string
      enum:
      - manufacturer
      - trader
      - service_provider
      - unknown
      title: BusinessNature
      description: What the company's papers say it does; tenders often require `manufacturer`.
    Certification:
      properties:
        kind:
          $ref: '#/components/schemas/CertificationKind'
        name:
          type: string
          title: Name
          description: As written on the certificate, e.g. 'IS 16227'.
        scope:
          anyOf:
          - type: string
          - type: 'null'
          title: Scope
        valid_until:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Valid Until
      additionalProperties: false
      type: object
      required:
      - kind
      - name
      title: Certification
    CertificationKind:
      type: string
      enum:
      - bis
      - iso
      - type_test
      - nsic
      - other
      title: CertificationKind
    Company:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        profile:
          $ref: '#/components/schemas/CompanyProfile'
        source:
          $ref: '#/components/schemas/CompanySource'
        verified_level:
          $ref: '#/components/schemas/VerifiedLevel'
        read_only:
          type: boolean
          title: Read Only
          description: True for the shared demo company.
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - profile
      - source
      - verified_level
      - read_only
      title: Company
    CompanyCreate:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        profile:
          $ref: '#/components/schemas/CompanyProfile'
      additionalProperties: false
      type: object
      required:
      - name
      - profile
      title: CompanyCreate
    CompanyFromUrl:
      properties:
        url:
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
          title: Url
      additionalProperties: false
      type: object
      required:
      - url
      title: CompanyFromUrl
    CompanyProfile:
      properties:
        legal_name:
          type: string
          title: Legal Name
        business_nature:
          $ref: '#/components/schemas/BusinessNature'
          default: unknown
        business_nature_wording:
          anyOf:
          - type: string
          - type: 'null'
          title: Business Nature Wording
          description: Exact wording on the company's papers, e.g. 'Trading Business'.
        constitution:
          anyOf:
          - type: string
          - type: 'null'
          title: Constitution
          examples:
          - proprietorship
          - private_limited
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
        msme:
          anyOf:
          - $ref: '#/components/schemas/MSEStatus'
          - type: 'null'
        startup_recognised:
          type: boolean
          title: Startup Recognised
          default: false
        products:
          items:
            type: string
          type: array
          title: Products
        annual_turnover:
          items:
